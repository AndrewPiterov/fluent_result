name: fluent_result
description: A fluent Result type for Dart that returns success/failure instead of throwing, with a global observability seam for crash reporting.
version: 8.5.0
homepage: https://github.com/AndrewPiterov/fluent_result
repository: https://github.com/AndrewPiterov/fluent_result
issue_tracker: https://github.com/AndrewPiterov/fluent_result/issues
topics:
  - result
  - error-handling
  - functional
  - either

environment:
  sdk: '>=2.14.0 <4.0.0'

dependencies:
  collection: ^1.17.1

dev_dependencies:
  coverage: ^1.7.2
  equatable: ^2.0.5
  given_when_then_unit_test: ^0.2.1
  lint: ^2.3.0
  shouldly: ^0.5.0+1
  test: ^1.24.4